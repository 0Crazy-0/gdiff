[project]
name = "gdiff"
version = "2.0.0"
description = "Copy your git diff plus a commit-message rule to the clipboard"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"