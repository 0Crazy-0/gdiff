name: Debug AUR SSH
on:
  workflow_dispatch:

jobs:
  debug-aur-ssh:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git openssh pacman-contrib nodejs
      - uses: actions/checkout@v4
      - name: Set up AUR SSH key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          echo "HOME is: $HOME"
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > /tmp/aur_known_host
          echo "--- ssh-keyscan output ---"
          cat /tmp/aur_known_host
          echo "--- end ---"
          FINGERPRINT="$(ssh-keygen -lf /tmp/aur_known_host | awk '{print $2}')"
          echo "Fingerprint obtained: $FINGERPRINT"
          EXPECTED="SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::AUR host key fingerprint mismatch! Got $FINGERPRINT, expected $EXPECTED"
            exit 1
          fi
          cat /tmp/aur_known_host >> ~/.ssh/known_hosts
          echo "--- known_hosts content ---"
          cat ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
      - name: Test SSH connection to AUR
        run: |
          echo "HOME in this step: $HOME"
          cat ~/.ssh/known_hosts 2>&1 || echo "known_hosts not found or empty"
          ssh -T aur@aur.archlinux.org -o StrictHostKeyChecking=yes || echo "SSH test exit code: $?"
      - name: Try git clone (dry run, no push)
        run: |
          git clone ssh://aur@aur.archlinux.org/gdiff.git /tmp/aur-test-clone
          echo "Clone succeeded"